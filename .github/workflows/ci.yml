name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ml-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: veritas
          POSTGRES_PASSWORD: veritas
          POSTGRES_DB: veritas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://veritas:veritas@localhost:5432/veritas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ml-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install ruff
      - run: ruff check .
      - run: pytest -v

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
